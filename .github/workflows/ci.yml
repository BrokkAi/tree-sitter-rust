name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - grammar.js
      - src/**
      - test/**
      - bindings/**
      - binding.gyp
      - Cargo.toml
      - Cargo.lock
  pull_request:
    paths:
      - grammar.js
      - src/**
      - test/**
      - bindings/**
      - binding.gyp
      - Cargo.toml
      - Cargo.lock

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  test:
    name: Test parser
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{vars.NODE_VERSION}}
      - name: Install pinned tree-sitter CLI
        run: npm ci --legacy-peer-deps
      - name: Set up examples
        run: |-
          git clone https://github.com/rust-lang-nursery/bitflags examples/bitflags --single-branch --depth=1 --filter=blob:none
          git clone https://github.com/rust-lang/libc examples/libc --single-branch --depth=1 --filter=blob:none
          git clone https://github.com/rust-lang/regex examples/regex --single-branch --depth=1 --filter=blob:none
          git clone https://github.com/serde-rs/serde examples/serde --single-branch --depth=1 --filter=blob:none
          git clone https://github.com/tokio-rs/tokio examples/tokio --single-branch --depth=1 --filter=blob:none
      - name: Verify generated parser
        shell: bash
        run: |-
          npx tree-sitter generate
          git diff --exit-code -- src
      - name: Run parser tests
        run: npx tree-sitter test
      - name: Run Rust tests
        run: cargo test --locked
      - name: Run Python tests
        shell: bash
        run: |-
          python -m pip install . 'tree-sitter~=0.22'
          python -m unittest discover -s bindings/python/tests
      - name: Run Go tests
        run: go test ./...
      - name: Run Swift tests
        if: runner.os != 'Windows'
        run: swift test
      - name: Parse examples
        uses: tree-sitter/parse-action@f44ffa94f802024f27e821a72e6f2f3efc5dd521 # v4
        with:
          files: |
            examples/**/*.rs
            !examples/libc/ctest/templates/test.rs
            !examples/libc/ctest/tests/input/invalid_syntax.rs
