name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    paths:
      - grammar.js
      - src/**
      - test/**
      - bindings/**
      - binding.gyp
      - Cargo.toml
      - Cargo.lock

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  test:
    name: Test parser
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{vars.NODE_VERSION}}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25"
      - name: Install pinned tree-sitter CLI
        shell: bash
        run: |-
          npm ci --legacy-peer-deps --ignore-scripts
          npm rebuild tree-sitter-cli
      - name: Set up examples
        run: |-
          git clone https://github.com/rust-lang-nursery/bitflags examples/bitflags --single-branch --depth=1 --filter=blob:none
          git clone https://github.com/rust-lang/libc examples/libc --single-branch --depth=1 --filter=blob:none
          git clone https://github.com/rust-lang/regex examples/regex --single-branch --depth=1 --filter=blob:none
          git clone https://github.com/serde-rs/serde examples/serde --single-branch --depth=1 --filter=blob:none
          git clone https://github.com/tokio-rs/tokio examples/tokio --single-branch --depth=1 --filter=blob:none
      - name: Verify generated parser
        shell: bash
        run: |-
          npx tree-sitter generate
          git diff --exit-code -- src
      - name: Run parser tests
        run: npx tree-sitter test
      - name: Run Rust tests
        run: cargo test --locked
      - name: Run Python tests
        shell: bash
        run: |-
          python -m pip install . 'tree-sitter~=0.22'
          python -m unittest discover -s bindings/python/tests
      - name: Run Go tests
        run: go test ./...
      - name: Run Swift tests
        if: runner.os != 'Windows'
        run: swift test
      - name: Parse examples
        shell: bash
        run: |-
          find examples -name '*.rs' \
            ! -path 'examples/libc/ctest/templates/test.rs' \
            ! -path 'examples/libc/ctest/tests/input/invalid_syntax.rs' \
            > example-files.txt
          npx tree-sitter parse --paths example-files.txt --quiet
