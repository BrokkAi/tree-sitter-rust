name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - grammar.js
      - src/**
      - test/**
      - bindings/**
      - binding.gyp
      - Cargo.toml
      - Cargo.lock
  pull_request:
    paths:
      - grammar.js
      - src/**
      - test/**
      - bindings/**
      - binding.gyp
      - Cargo.toml
      - Cargo.lock

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  test:
    name: Test parser
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@49f8c1f20b60102eae8c033bb7c7f6cd056f6086 # v2
      - name: Set up examples
        run: |-
          git clone https://github.com/rust-lang-nursery/bitflags examples/bitflags --single-branch --depth=1 --filter=blob:none
          git clone https://github.com/rust-lang/libc examples/libc --single-branch --depth=1 --filter=blob:none
          git clone https://github.com/rust-lang/regex examples/regex --single-branch --depth=1 --filter=blob:none
          git clone https://github.com/serde-rs/serde examples/serde --single-branch --depth=1 --filter=blob:none
          git clone https://github.com/tokio-rs/tokio examples/tokio --single-branch --depth=1 --filter=blob:none
      - name: Run tests
        uses: tree-sitter/parser-test-action@05f6ce7c7e54603c45cd87ed926725dc870bcc63 # v3
        with:
          test-rust: true
          test-node: false
          test-python: true
          test-go: true
          test-swift: true
      - name: Parse examples
        uses: tree-sitter/parse-action@f44ffa94f802024f27e821a72e6f2f3efc5dd521 # v4
        with:
          files: |
            examples/**/*.rs
            !examples/libc/ctest/templates/test.rs
            !examples/libc/ctest/tests/input/invalid_syntax.rs
